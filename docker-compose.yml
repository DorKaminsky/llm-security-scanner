version: "3.9"

services:
  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=lambda,apigateway,sqs,dynamodb,s3,cognito-idp,secretsmanager,sts
      - DEBUG=0
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./infrastructure/localstack/init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENV=local
    depends_on:
      - api-gateway

  scan-orchestrator:
    build:
      context: ./services/scan-orchestrator
    ports:
      - "8001:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - ENVIRONMENT=local
    env_file:
      - .env
    depends_on:
      - localstack

  prompt-injection-checker:
    build:
      context: ./services/checkers/prompt-injection
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    env_file:
      - .env
    depends_on:
      - localstack

  sensitive-disclosure-checker:
    build:
      context: ./services/checkers/sensitive-disclosure
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    env_file:
      - .env
    depends_on:
      - localstack

  dos-resilience-checker:
    build:
      context: ./services/checkers/dos-resilience
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    env_file:
      - .env
    depends_on:
      - localstack

  excessive-agency-checker:
    build:
      context: ./services/checkers/excessive-agency
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    env_file:
      - .env
    depends_on:
      - localstack

  report-generator:
    build:
      context: ./services/report-generator
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    env_file:
      - .env
    depends_on:
      - localstack

volumes:
  localstack_data:
