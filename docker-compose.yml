version: "3.9"

# Local development stack using LocalStack for AWS services.
# Usage: cp .env.example .env && docker-compose up
# Frontend: http://localhost:5173
# API:      http://localhost:8000

x-aws-local: &aws-local
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

x-service-common: &service-common
  environment:
    <<: *aws-local
    ENVIRONMENT: local
    LOG_LEVEL: DEBUG
    SCANS_TABLE: scans
    RESULTS_TABLE: results
    CHECKS_QUEUE_URL: http://localstack:4566/000000000000/checks.fifo
    REPORTS_BUCKET: llm-scanner-reports
  depends_on:
    localstack:
      condition: service_healthy

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.4
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,sqs,s3,secretsmanager,sts
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infrastructure/localstack/init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API Gateway (lightweight local proxy) ───────────────────────────────────
  api-gateway:
    image: python:3.12-slim
    command: python /proxy/proxy.py
    volumes:
      - ./infrastructure/local-proxy:/proxy
    ports:
      - "8000:8000"
    depends_on:
      - scan-orchestrator
      - scan-status

  # ── Lambda services (run as HTTP servers locally via python-lambda-local) ──
  scan-orchestrator:
    build:
      context: ./services
      dockerfile: scan-orchestrator/Dockerfile
    ports:
      - "8001:8080"
    <<: *service-common

  scan-status:
    build:
      context: ./services
      dockerfile: scan-status-api/Dockerfile
    ports:
      - "8002:8080"
    <<: *service-common

  prompt-injection:
    build:
      context: ./services
      dockerfile: checkers/prompt-injection/Dockerfile
    <<: *service-common

  sensitive-disclosure:
    build:
      context: ./services
      dockerfile: checkers/sensitive-disclosure/Dockerfile
    <<: *service-common

  dos-resilience:
    build:
      context: ./services
      dockerfile: checkers/dos-resilience/Dockerfile
    <<: *service-common

  excessive-agency:
    build:
      context: ./services
      dockerfile: checkers/excessive-agency/Dockerfile
    <<: *service-common

  report-generator:
    build:
      context: ./services
      dockerfile: report-generator/Dockerfile
    <<: *service-common

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_COGNITO_USER_POOL_ID: local_pool
      VITE_COGNITO_CLIENT_ID: local_client
    depends_on:
      - api-gateway

volumes:
  localstack_data:
