name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.0"

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write  # OIDC — no long-lived AWS keys stored in GitHub
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda functions
        run: |
          for service in scan-orchestrator checkers/prompt-injection checkers/sensitive-disclosure \
                         checkers/dos-resilience checkers/excessive-agency report-generator scan-status-api; do
            echo "Packaging $service..."
            mkdir -p services/$service/package
            pip install -r services/$service/requirements.txt -t services/$service/package/ -q
            cp -r services/shared/. services/$service/package/
            cp services/$service/handler.py services/$service/package/
            zip_name="lambda-$(echo $service | tr '/' '-').zip"
            (cd services/$service/package && zip -r ../../../../infrastructure/terraform/$zip_name . -q)
            rm -rf services/$service/package
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Build frontend
        run: |
          npm install
          npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Apply
        run: |
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_environment: production

      - name: Deploy frontend to S3 + invalidate CloudFront
        run: |
          BUCKET=$(terraform output -raw frontend_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../frontend/dist s3://$BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        working-directory: infrastructure/terraform
