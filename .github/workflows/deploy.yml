name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.7.0"

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write  # OIDC auth to AWS — no long-lived keys
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package Lambda functions
        run: |
          for service in scan-orchestrator checkers/prompt-injection checkers/sensitive-disclosure checkers/dos-resilience checkers/excessive-agency report-generator; do
            echo "Packaging $service..."
            cd services/$service
            pip install -r requirements.txt -t package/
            cp -r ../shared/* package/
            cp handler.py package/
            cd package && zip -r ../../../../infrastructure/terraform/lambda-$( echo $service | tr '/' '-').zip . && cd ../..
            rm -rf package/
            cd ../..
          done

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          REACT_APP_ENV: production

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infrastructure/terraform
        env:
          TF_VAR_environment: production
          TF_VAR_frontend_bucket: ${{ secrets.FRONTEND_BUCKET }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform

      - name: Deploy frontend to S3
        run: |
          BUCKET=$(terraform output -raw frontend_bucket_name)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../frontend/build s3://$BUCKET --delete
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        working-directory: infrastructure/terraform
